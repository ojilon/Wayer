org.gradle.jvmargs=-Xmx2048M -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableJetifier=true

# ---------------------------------------------------------------------------
# App version — your Python tool should only edit these two lines
# versionCode: integer, must increase for every Play/sideload update
# versionName: human-readable string
# ---------------------------------------------------------------------------
app.versionCode=2
app.versionName=0.0.10

# SDK levels (reference; app/build.gradle may hardcode some)
ndkVersion=29.0.14206865
compileSdkVersion=36
targetSdkVersion=34
minSdkVersion=26

# ---------------------------------------------------------------------------
# Native ABIs shipped inside the APK
# Comma-separated, no spaces preferred.
#
# Experiment branch (Odin rewrite): arm64-v8a ONLY.
#   - Covers virtually every phone from ~2017 onward, including yours.
#   - Odin currently has a solid linux_arm64 + android subtarget path.
#   - Adding armeabi-v7a / x86_64 later is a one-line change here plus
#     a matching arm/x86 target block in native/CMakeLists.txt.
# ---------------------------------------------------------------------------
aurora.abiFilters=arm64-v8a
aurora.abiFilters=arm64-v8a

markwonVersion=4.6.2
