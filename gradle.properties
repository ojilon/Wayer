org.gradle.jvmargs=-Xmx2048M -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableJetifier=true

# ---------------------------------------------------------------------------
# App version — your Python tool should only edit these two lines
# versionCode: integer, must increase for every Play/sideload update
# versionName: human-readable string
# ---------------------------------------------------------------------------
app.versionCode=1
app.versionName=0.0.1_0

# SDK levels (reference; app/build.gradle may hardcode some)
ndkVersion=29.0.14206865
compileSdkVersion=36
targetSdkVersion=34
minSdkVersion=26

# ---------------------------------------------------------------------------
# Native ABIs shipped inside the APK
# Comma-separated, no spaces preferred.
# Common set for real devices:
#   arm64-v8a   = modern 64-bit phones (yours)
#   armeabi-v7a = older 32-bit ARM
#   x86_64      = many emulators / some Chromebooks
#   x86         = older emulators
# Narrow the list for faster local debug builds if you want.
# ---------------------------------------------------------------------------
aurora.abiFilters=arm64-v8a,armeabi-v7a,x86_64

markwonVersion=4.6.2
