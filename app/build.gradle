plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.wayer'
    compileSdk 36

    ndkVersion "29.0.14206865"

    buildFeatures {
        viewBinding true
    }

    defaultConfig {
        applicationId "com.example.wayer"
        minSdk 26
        targetSdk 34

        versionCode project.property("app.versionCode").toInteger()
        versionName project.property("app.versionName")

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        ndk {
            def abiProperty = project.findProperty("aurora.abiFilters") as String
            if (abiProperty != null) {
                abiFilters.addAll(abiProperty.split(",").collect { it.trim() })
            }
        }

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++23"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    externalNativeBuild {
        cmake {
            path file("../native/CMakeLists.txt")
            version "3.22.1"
        }
    }

    testOptions {
        unitTests {
            includeAndroidResources = false
            returnDefaultValues = true
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    // Unit tests (JVM)
    testImplementation 'junit:junit:4.13.2'

    // Instrumented tests (device / emulator) — optional for later
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
