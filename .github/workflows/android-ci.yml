name: Android CI

on:
  push:
    branches: [ main, restructure_ui, ui_home_files_work ]
  pull_request:
    branches: [ main, restructure_ui ]

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Unit tests compile app sources; native build needs NDK.
      # Install NDK side-by-side with the version in app/build.gradle.
      - name: Install NDK
        run: |
          sdkmanager --install "ndk;29.0.14206865" "cmake;3.22.1" || \
          sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore
