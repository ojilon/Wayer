plugins {
    id 'com.android.application'
}

// Optional local signing file (never commit real passwords).
// Create app/keystore.properties from keystore.properties.example
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace 'com.example.wayer'
    compileSdk 36

    ndkVersion "29.0.14206865"

    buildFeatures {
        viewBinding true
    }

    defaultConfig {
        applicationId "com.example.wayer"
        minSdk 26
        targetSdk 34

        // Python tool edits gradle.properties → these read here
        versionCode project.property("app.versionCode").toInteger()
        versionName project.property("app.versionName")

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Multi-ABI: comma list in gradle.properties → aurora.abiFilters
        ndk {
            def abiProperty = project.findProperty("aurora.abiFilters") as String
            if (abiProperty != null && !abiProperty.trim().isEmpty()) {
                abiFilters.clear()
                abiFilters.addAll(abiProperty.split(",").collect { it.trim() }.findAll { !it.isEmpty() })
            }
        }
    }

    signingConfigs {
        release {
            // Prefer keystore.properties; fall back to env vars (CI / Python tool)
            if (keystorePropertiesFile.exists()) {
                storeFile file(keystoreProperties["storeFile"])
                storePassword keystoreProperties["storePassword"]
                keyAlias keystoreProperties["keyAlias"]
                keyPassword keystoreProperties["keyPassword"]
            } else if (System.getenv("WAYER_STORE_FILE")) {
                storeFile file(System.getenv("WAYER_STORE_FILE"))
                storePassword System.getenv("WAYER_STORE_PASSWORD")
                keyAlias System.getenv("WAYER_KEY_ALIAS")
                keyPassword System.getenv("WAYER_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Only apply signing when a keystore is configured
            if (keystorePropertiesFile.exists() || System.getenv("WAYER_STORE_FILE")) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests {
            includeAndroidResources = false
            returnDefaultValues = true
        }
    }

    // One APK with all ABIs listed in aurora.abiFilters (simple for sideload).
    // For Play Store later you can enable splits / App Bundle.
    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    testImplementation 'junit:junit:4.13.2'

    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}


// Zig build task - builds libwayer_core.so using zig build
tasks.register("buildZigLib") {
    doLast {
        def ndkDir = android.ndkDirectory
        def abiFilters = project.findProperty("aurora.abiFilters") as String ?: "arm64-v8a"
        def abi = abiFilters.split(",")[0].trim()
        
        def zigTarget
        def zigSubtarget
        switch (abi) {
            case "arm64-v8a":
                zigTarget = "aarch64-linux-android"
                zigSubtarget = ""
                break
            case "armeabi-v7a":
                zigTarget = "arm-linux-android"
                zigSubtarget = ""
                break
            case "x86_64":
                zigTarget = "x86_64-linux-android"
                zigSubtarget = ""
                break
            case "x86":
                zigTarget = "i386-linux-android"
                zigSubtarget = ""
                break
            default:
                throw new GradleException("Unsupported ABI: ${abi}")
        }
        
        def zigCmd = "zig build -Dtarget=${zigTarget}${zigSubtarget ? '-' + zigSubtarget : ''} --prefix zig-out"
        def buildDir = file("../native/zig")
        
        // Use NDK's zig if available, otherwise system zig
        def ndkZig = file("${ndkDir}/toolchains/llvm/prebuilt/${org.gradle.internal.os.OperatingSystem.current().name.toLowerCase()}-x86_64/bin/zig")
        def zigExe = ndkZig.exists() ? ndkZig.absolutePath : "zig"
        
        def proc = [zigExe, "build", "-Dtarget=${zigTarget}${zigSubtarget ? '-' + zigSubtarget : ''}", "--prefix", "zig-out"].execute(null, buildDir)
        proc.waitFor()
        
        def exitCode = proc.exitValue()
        if (exitCode != 0) {
            def err = proc.err.text
            def out = proc.in.text
            throw new GradleException("Zig build failed (exit ${exitCode}):\n${out}\n${err}")
        }
        
        // Copy the built library to jniLibs
        def srcLib = file("${buildDir}/zig-out/lib/libwayer_core.so")
        def destDir = file("src/main/jniLibs/${abi}")
        destDir.mkdirs()
        copy {
            from srcLib
            into destDir
        }
        logger.lifecycle("Zig library copied to ${destDir}/libwayer_core.so")
    }
}

// Ensure Zig build runs before native compilation
tasks.named("preBuild").configure {
    dependsOn "buildZigLib"
}

// Copies the freshest NDK compile_commands.json to a stable, gitignored path
// (repo-root build/) so clangd finds it without digging through app/.cxx
// hashes (see .clangd). Runs automatically after every native build.
//
// NOTE: this must stay a plain task with a doLast + project.copy. The earlier
// Copy-task version called from() inside doFirst, which configures the copy
// spec too late — the task "succeeded" while copying nothing.
tasks.register("copyCompileCommands") {
    doLast {
        // NOTE: AGP keeps .cxx next to the module (app/.cxx), not under build/.
        def cxxDir = file("${projectDir}/.cxx")
        def dbs = fileTree(cxxDir) { include "**/compile_commands.json" }.files
        if (dbs.isEmpty()) {
            throw new GradleException("No compile_commands.json found under ${cxxDir}")
        }
        // Prefer the on-device ABI (newest of those); fall back to newest overall.
        def arm64 = dbs.findAll { it.path.contains("arm64-v8a") }
        def pool = arm64.isEmpty() ? dbs : arm64
        def found = pool.max { it.lastModified() }
        copy {
            from(found)
            into(rootProject.file("build"))
            rename { "compile_commands.json" }
        }
        logger.lifecycle("compile_commands.json <- ${found}")
    }
}

afterEvaluate {
    tasks.named("buildZigLib").configure {
        finalizedBy "copyCompileCommands"
    }
}